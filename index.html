<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Battle Engine Prototype</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; height: 100vh; }

#canvas-container { width: 100vw; height: 100vh; display: block; }

/* HUD Dashboard */
.hud-layer {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
}

.stats-panel {
  display: flex;
  gap: 15px;
}

.stat-badge {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid #ef4444;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
}

/* Crosshair Target */
.crosshair {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 24px; height: 24px;
  pointer-events: none;
}
.crosshair::before, .crosshair::after {
  content: ''; position: absolute; background: #22c55e; box-shadow: 0 0 8px #22c55e;
}
.crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
.crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }

/* Fire / Touch Controls */
.controls-layer {
  position: absolute;
  bottom: 30px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 30px;
  pointer-events: auto;
}

.btn-fire {
  width: 85px; height: 85px;
  background: radial-gradient(circle, #ef4444, #991b1b);
  border: 3px solid #fca5a5;
  border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  font-weight: bold; font-size: 16px;
  box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
  cursor: pointer;
  transition: transform 0.1s;
}
.btn-fire:active { transform: scale(0.92); }

.instruction-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #ef4444;
  text-align: center;
  pointer-events: auto;
  cursor: pointer;
}
</style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Game HUD -->
  <div class="hud-layer">
    <div class="stats-panel">
      <div class="stat-badge">🎯 TARGETS ELIMINATED: <span id="score">0</span></div>
      <div class="stat-badge">❤️ HEALTH: <span id="hp">100</span>%</div>
    </div>
  </div>

  <div class="crosshair"></div>

  <div class="controls-layer">
    <div style="font-size: 12px; color: #aaa; align-self: center;">Drag Screen to Aim / Move</div>
    <div class="btn-fire" onclick="fireWeapon()">FIRE</div>
  </div>

  <div class="instruction-overlay" id="startInstructions" onclick="initGameSession()">
    <h2 style="color: #ef4444; margin-bottom: 10px;">3D BATTLE ENGINE</h2>
    <p>Tap anywhere to Start & Lock Camera</p>
  </div>

<!-- Three.js 3D Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
