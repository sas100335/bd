<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fight: Ultimate Edition ⚔️🥷</title>
<style>
* { box-sizing: border-box; user-select: none; touch-action: manipulation; }
body {
  margin: 0;
  background: #050508;
  color: #fff;
  font-family: 'Courier New', Courier, monospace;
  text-align: center;
  overflow: hidden;
}
h1 {
  color: #ff2222;
  margin: 8px 0;
  font-size: 20px;
  text-shadow: 0 0 12px #ff0000, 0 0 5px #fff;
  letter-spacing: 2px;
}
.arena-container {
  position: relative;
  width: 100%;
  max-width: 450px;
  height: 250px;
  margin: 0 auto;
  background: linear-gradient(180deg, #100b1a 0%, #2b080f 60%, #150205 100%);
  border: 3px solid #ff3333;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
}
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 8px 15px;
  position: absolute;
  top: 0;
  z-index: 10;
  background: rgba(0,0,0,0.4);
}
.fighter-info { width: 45%; text-align: left; }
.fighter-info.right { text-align: right; }
.name { font-size: 11px; font-weight: bold; color: #ffcc00; margin-bottom: 2px; }
.bar-box {
  width: 100%;
  height: 14px;
  background: #222;
  border: 1px solid #fff;
  border-radius: 7px;
  overflow: hidden;
}
.health-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff0000, #ff9900);
  width: 100%;
  transition: width 0.15s ease-out;
}
.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35px;
  background: #0a0404;
  border-top: 2px solid #ff2222;
}
/* Fighter Styles - Shadow Ninja */
.warrior {
  position: absolute;
  bottom: 35px;
  width: 50px;
  height: 90px;
  transition: left 0.05s linear;
}
.shadow-body {
  position: absolute;
  bottom: 0;
  width: 24px;
  height: 55px;
  background: #000;
  border: 1px solid #444;
  left: 13px;
  border-radius: 4px;
}
.shadow-head {
  position: absolute;
  bottom: 50px;
  width: 20px;
  height: 20px;
  background: #000;
  border: 1px solid #444;
  border-radius: 50%;
  left: 15px;
}
.shadow-limb {
  position: absolute;
  background: #000;
  border: 1px solid #333;
}
#player { left: 40px; }
#player .shadow-head, #player .shadow-body { border-color: #00ffff; box-shadow: 0 0 8px #00ffff; }
#enemy { right: 40px; transform: scaleX(-1); }
#enemy .shadow-head, #enemy .shadow-body { border-color: #ff0055; box-shadow: 0 0 8px #ff0055; }

/* Attack Animations */
.punch-anim .shadow-body { transform: skewX(-15deg); }
.kick-anim .shadow-body { transform: rotate(15deg) translateY(-5px); }

.controls {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 450px;
  margin: 12px auto;
  padding: 0 10px;
}
.btn-row { display: flex; gap: 8px; }
.ctrl-btn {
  width: 50px;
  height: 50px;
  background: #1a1a24;
  border: 2px solid #ff3333;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}
.ctrl-btn:active { background: #ff3333; transform: scale(0.92); }
#statusMsg {
  font-size: 15px;
  color: #ffcc00;
  font-weight: bold;
  margin: 5px 0;
  min-height: 22px;
  text-shadow: 0 0 5px rgba(255,204,0,0.5);
}
.restart-btn {
  background: linear-gradient(135deg, #ff3333, #990000);
  border: none;
  padding: 10px 25px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255,0,0,0.5);
  margin-top: 5px;
}
</style>
</head>
<body>

<h1>🥷 SHADOW FIGHT: ULTIMATE ⚔️</h1>
<div id="statusMsg">Fight! Defeat the Shadow Rival!</div>

<div class="arena-container">
  <div class="hud">
    <div class="fighter-info">
      <div class="name">PLAYER</div>
      <div class="bar-box"><div id="pHealthBar" class="health-fill"></div></div>
    </div>
    <div class="fighter-info right">
      <div class="name">RIVAL SHADOW</div>
      <div class="bar-box"><div id="eHealthBar" class="health-fill"></div></div>
    </div>
  </div>

  <!-- Player Ninja -->
  <div id="player" class="warrior">
    <div class="shadow-head"></div>
    <div class="shadow-body"></div>
  </div>

  <!-- Enemy Ninja -->
  <div id="enemy" class="warrior">
    <div class="shadow-head"></div>
    <div class="shadow-body"></div>
  </div>

  <div class="ground"></div>
</div>

<div class="controls">
  <div class="btn-row">
    <button class="ctrl-btn" onclick="movePlayer(-15)">◀</button>
    <button class="ctrl-btn" onclick="movePlayer(15)">▶</button>
  </div>
  <div class="btn-row">
    <button class="ctrl-btn" onclick="playerAttack('punch')" style="border-color:#00ffff;">👊</button>
    <button class="ctrl-btn" onclick="playerAttack('kick')" style="border-color:#ff0055;">🦶</button>
  </div>
</div>

<button class="restart-btn" onclick="resetGame()">Restart Battle 🔄</button>

<script>
// Sound FX via Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') { audioCtx.resume(); }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  if (type === 'punch') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'kick') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'win') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.setValueAtTime(450, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }
}

let pPos = 40;
let ePos = 320;
let pHealth = 100;
let eHealth = 100;
let isGameOver = false;

const playerEl = document.getElementById('player');
const enemyEl = document.getElementById('enemy');
const msgEl = document.getElementById('statusMsg');

function updatePositions() {
  playerEl.style.left = pPos + 'px';
  enemyEl.style.right = (450 - ePos - 50) + 'px';
}
updatePositions();

function movePlayer(dir) {
  if (isGameOver) return;
  pPos = Math.max(10, Math.min(ePos - 45, pPos + dir));
  updatePositions();
}

function playerAttack(type) {
  if (isGameOver) return;
  
  playSound(type);
  playerEl.classList.add(type === 'punch' ? 'punch-anim' : 'kick-anim');
  setTimeout(() => playerEl.classList.remove('punch-anim', 'kick-anim'), 180);

  // Distance check for hit
  let distance = ePos - pPos;
  if (distance < 65) {
    let dmg = type === 'punch' ? 12 : 18;
    eHealth = Math.max(0, eHealth - dmg);
    document.getElementById('eHealthBar').style.width = eHealth + '%';
    
    if (eHealth <= 0) {
      isGameOver = true;
      msgEl.textContent = "🏆 Flawless Victory! You Won!";
      playSound('win');
      return;
    }
  }

  // Enemy counter response
  setTimeout(enemyAI, 300);
}

function enemyAI() {
  if (isGameOver) return;
  
  let distance = ePos - pPos;
  if (distance > 55) {
    ePos -= 15; // Move closer
    updatePositions();
  } else {
    // Enemy attacks
    playSound('punch');
    enemyEl.classList.add('punch-anim');
    setTimeout(() => enemyEl.classList.remove('punch-anim'), 180);

    pHealth = Math.max(0, pHealth - 12);
    document.getElementById('pHealthBar').style.width = pHealth + '%';

    if (pHealth <= 0) {
      isGameOver = true;
      msgEl.textContent = "💀 Defeat! Rival Shadow Overpowered You!";
    }
  }
}

function resetGame() {
  pPos = 40;
  ePos = 320;
  pHealth = 100;
  eHealth = 100;
  isGameOver = false;
  document.getElementById('pHealthBar').style.width = '100%';
  document.getElementById('eHealthBar').style.width = '100%';
  msgEl.textContent = "Fight! Defeat the Shadow Rival!";
  updatePositions();
}
</script>

</body>
</html>
