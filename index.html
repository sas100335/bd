<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neural Portal: Live Data Capture 🚀</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; color: #fff; display: flex; justify-content: center; align-items: center; }

#particleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.portal-card {
  position: relative; z-index: 10;
  width: 90%; max-width: 420px;
  padding: 40px 32px;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 28px;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
  text-align: center;
}

.avatar-ring {
  width: 70px; height: 70px; margin: 0 auto 20px auto;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  padding: 3px;
  box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
}
.avatar-inner {
  width: 100%; height: 100%; background: #0f172a; border-radius: 50%;
  display: flex; justify-content: center; align-items: center; font-size: 28px;
}

h2 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }

.input-field { position: relative; margin-bottom: 20px; text-align: left; }
.input-field label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
.input-field input {
  width: 100%; padding: 15px 18px; background: rgba(30, 41, 59, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
  color: #fff; font-size: 15px; outline: none; transition: 0.3s;
}
.input-field input:focus { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }

.btn-primary {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border: none; border-radius: 14px;
  color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
  margin-top: 10px;
}
.btn-primary:active { transform: scale(0.97); }
#errorMsg { color: #f43f5e; font-size: 13px; margin-top: 15px; min-height: 20px; }

/* Dashboard Card */
.dashboard-card { display: none; text-align: left; }
.captured-box {
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0 25px 0;
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
}

.logout-anim-btn {
  position: relative; width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: #e11d48;
  border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; overflow: hidden; transition: 0.4s;
  box-shadow: 0 10px 30px rgba(225, 29, 72, 0.4);
}
.door-icon { width: 22px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; margin-left: 10px; }
.walking-man {
  position: absolute; right: 35%; width: 10px; height: 18px;
  background: #fff; border-radius: 3px; opacity: 0;
  transition: transform 0.6s ease-in-out, opacity 0.3s ease;
}
.logout-anim-btn.animating .walking-man { opacity: 1; transform: translateX(55px); }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<!-- Login Form -->
<div class="portal-card" id="loginCard">
  <div class="avatar-ring">
    <div class="avatar-inner">⚡</div>
  </div>
  <h2>Neural Portal</h2>
  <p class="desc">Enter authorized credentials to capture & connect</p>

  <div class="input-field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="user@nexus.io" autocomplete="off">
  </div>

  <div class="input-field">
    <label>Passcode / Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn-primary" onclick="handleLogin()">Capture & Access ➔</button>
  <div id="errorMsg"></div>
</div>

<!-- Dashboard with Live Captured Data Display -->
<div class="portal-card dashboard-card" id="dashCard">
  <h2 style="color:#10b981; text-align:center;">Data Captured! 🛡️</h2>
  <p class="desc" style="text-align:center; margin-bottom:15px;">The user entered the following details into the system:</p>

  <div class="captured-box" id="dataDisplay">
    <!-- Captured info will appear here -->
  </div>

  <button class="logout-anim-btn" id="logoutBtn" onclick="handleLogout()">
    <span id="btnText">Sign Out & Reset</span>
    <svg class="door-icon" viewBox="0 0 24 24">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
    </svg>
    <div class="walking-man"></div>
  </button>
</div>

<script>
// Canvas Background
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];

function initCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * width, y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, size: Math.random() * 2 + 1
    });
  }
}
window.addEventListener('resize', initCanvas);
initCanvas();

function drawCanvas() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
  ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';
  particles.forEach((p, idx) => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > width) p.vx *= -1;
    if (p.y < 0 || p.y > height) p.vy *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    for (let j = idx + 1; j < particles.length; j++) {
      let p2 = particles[j];
      if (Math.hypot(p.x - p2.x, p.y - p2.y) < 120) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }
  });
  requestAnimationFrame(drawCanvas);
}
drawCanvas();

// Login & Capture Logic
function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (!email || !pass) {
    errorMsg.textContent = "⚠️ Please fill all input fields.";
    return;
  }

  errorMsg.textContent = "";

  // Display captured data on screen instantly!
  document.getElementById('dataDisplay').innerHTML = `
    📧 <b>Email:</b> ${email}<br>
    🔑 <b>Password:</b> ${pass}<br>
    🕒 <b>Time:</b> ${new Date().toLocaleTimeString()}
  `;

  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('dashCard').style.display = 'block';
}

function handleLogout() {
  const btn = document.getElementById('logoutBtn');
  btn.classList.add('animating');
  document.getElementById('btnText').textContent = "Logging Out...";

  setTimeout(() => {
    btn.classList.remove('animating');
    document.getElementById('btnText').textContent = "Sign Out & Reset";
    document.getElementById('email').value = "";
    document.getElementById('password').value = "";
    document.getElementById('dashCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
  }, 900);
}
</script>

</body>
</html>
