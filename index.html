<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Vault Login 💖</title>
<style>
* { box-sizing: border-box; user-select: none; }
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #0d021a, #2b0626, #12020f);
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.login-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(15px);
  border: 2px solid rgba(255, 51, 153, 0.3);
  border-radius: 25px;
  padding: 35px 25px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
  position: relative;
  z-index: 10;
}

.vault-icon {
  font-size: 55px;
  margin-bottom: 10px;
  animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h2 {
  color: #ff3399;
  margin-bottom: 5px;
  font-size: 24px;
  text-shadow: 0 0 10px rgba(255, 51, 153, 0.5);
}

p {
  color: #ffb3d9;
  font-size: 13px;
  margin-bottom: 25px;
}

.input-group {
  position: relative;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px 20px;
  background: rgba(0, 0, 0, 0.4);
  border: 2px solid rgba(255, 51, 153, 0.4);
  border-radius: 15px;
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
  text-align: center;
}

input:focus {
  border-color: #ff3399;
  box-shadow: 0 0 15px rgba(255, 51, 153, 0.5);
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #ff3399, #cc0066);
  border: none;
  border-radius: 15px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 51, 153, 0.4);
  transition: 0.2s;
}

button:active {
  transform: scale(0.96);
}

#errorMsg {
  color: #ff4d4d;
  font-size: 13px;
  margin-top: 15px;
  min-height: 18px;
  font-weight: bold;
}

/* Success Dashboard Style */
.dashboard {
  display: none;
  text-align: center;
  animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.success-heart {
  font-size: 70px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="login-card" id="loginBox">
  <div class="vault-icon">🔐</div>
  <h2>Secret Vault</h2>
  <p>Enter the passcode to open Sasmitha's Heart</p>
  
  <div class="input-group">
    <input type="password" id="passcode" placeholder="Enter Secret Code" maxlength="6">
  </div>
  
  <button onclick="checkLogin()">Unlock Vault 🔓</button>
  <div id="errorMsg"></div>
</div>

<!-- Welcome Dashboard (Hidden initially) -->
<div class="login-card dashboard" id="dashBox">
  <div class="success-heart">💖</div>
  <h2 style="color:#00ffff; text-shadow: 0 0 10px #00ffff;">Access Granted!</h2>
  <p style="color:#fff; font-size:15px; margin-top:15px;">
    Welcome to the secret world, Sasmitha & Vinoth! ✨<br>
    Your love story is safely locked in this digital vault forever. 🌹
  </p>
  <button onclick="lockVault()" style="margin-top:20px; background:linear-gradient(135deg, #00cccc, #006666);">Lock Again 🔒</button>
</div>

<script>
function checkLogin() {
  const code = document.getElementById('passcode').value;
  const errorMsg = document.getElementById('errorMsg');
  
  // මෙන්න මෙතන ඔයාට ඕන පාස්වර්ඩ් එක දාගන්න පුළුවන් (උදාහරණයක් විදිහට 1432)
  if (code === "1432" || code === "sasmitha") {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashBox').style.display = 'block';
    
    // Celebration effect
    for (let i = 0; i < 30; i++) {
      createHeart();
    }
  } else {
    errorMsg.textContent = "❌ Wrong Passcode! Hint: Try 1432";
    // Shake effect
    const card = document.getElementById('loginBox');
    card.style.transform = "translateX(10px)";
    setTimeout(() => card.style.transform = "translateX(-10px)", 100);
    setTimeout(() => card.style.transform = "translateX(0)", 200);
  }
}

function lockVault() {
  document.getElementById('passcode').value = "";
  document.getElementById('errorMsg').textContent = "";
  document.getElementById('dashBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
}

function createHeart() {
  const h = document.createElement('div');
  h.textContent = Math.random() > 0.5 ? '❤️' : '✨';
  h.style.position = 'fixed';
  h.style.left = Math.random() * 100 + 'vw';
  h.style.top = '-30px';
  h.style.fontSize = '22px';
  h.style.transition = 'transform 3s linear';
  document.body.appendChild(h);

  setTimeout(() => {
    h.style.transform = `translateY(110vh) rotate(360deg)`;
  }, 50);

  setTimeout(() => h.remove(), 3200);
}
</script>

</body>
</html>
