<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Portal with Logout Animation 🚪✨</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
body {
  background: #0f172a;
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Login Card Container */
.login-card {
  position: relative;
  width: 100%;
  max-width: 400px;
  padding: 40px 30px;
  background: #1e293b;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
  text-align: center;
  z-index: 10;
  transition: all 0.4s ease;
}

.login-card h2 {
  font-size: 26px;
  margin-bottom: 8px;
  color: #f8fafc;
}

.login-card p {
  font-size: 14px;
  color: #94a3b8;
  margin-bottom: 30px;
}

.input-box {
  position: relative;
  margin-bottom: 20px;
  text-align: left;
}

.input-box label {
  display: block;
  font-size: 13px;
  color: #cbd5e1;
  margin-bottom: 6px;
  font-weight: 500;
}

.input-box input {
  width: 100%;
  padding: 14px 16px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: 0.3s;
}

.input-box input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: #6366f1;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  margin-top: 10px;
}

.btn-login:hover {
  background: #4f46e5;
}

.btn-login:active {
  transform: scale(0.98);
}

#errorMsg {
  color: #ef4444;
  font-size: 13px;
  margin-top: 15px;
  min-height: 18px;
}

/* Dashboard & Logout Animation Container */
.dashboard {
  display: none;
  position: relative;
  z-index: 10;
  width: 90%;
  max-width: 450px;
  padding: 40px 30px;
  background: #1e293b;
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  text-align: center;
}

.dashboard h1 {
  font-size: 24px;
  color: #10b981;
  margin-bottom: 10px;
}

.dashboard p {
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 30px;
}

/* --- THE CREATIVE LOGOUT BUTTON ANIMATION (As requested from photo) --- */
.logoutButton {
  background: #252839;
  color: #f4f7ff;
  border: none;
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.logoutButton:hover {
  background: #31354d;
}

.logoutButton .doorway {
  position: relative;
  width: 20px;
  height: 24px;
  fill: #1f2335;
  transition: 0.3s;
}

.logoutButton .man {
  position: absolute;
  left: 12px;
  bottom: 14px;
  width: 12px;
  height: 24px;
  background: #6366f1;
  border-radius: 4px;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Animation trigger class */
.logoutButton.logging-out .man {
  transform: translateX(35px) scaleY(0.9);
}

.logoutButton.logging-out {
  padding-left: 45px;
  background: #ef4444;
}
</style>
</head>
<body>

<!-- Login Form -->
<div class="login-card" id="loginBox">
  <h2>Welcome Back</h2>
  <p>Enter your account credentials to proceed</p>
  
  <div class="input-box">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="name@example.com" autocomplete="off">
  </div>

  <div class="input-box">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn-login" onclick="login()">Log In ➔</button>
  <div id="errorMsg"></div>
</div>

<!-- Logged in Dashboard with Creative Logout Button -->
<div class="dashboard" id="dashboardBox">
  <h1>Dashboard Active ✨</h1>
  <p>You have successfully authenticated into the secure portal.</p>
  
  <!-- The Man Walking Out Logout Button -->
  <button class="logoutButton" id="logoutBtn" onclick="logoutAnimation()">
    <span class="button-text">Log Out</span>
    <svg class="doorway" viewBox="0 0 24 24">
      <path d="M19,2H5C3.89,2 3,2.89 3,4V20C3,21.11 3.89,22 5,22H19C20.11,22 21,21.11 21,20V4C21,289 20.11,2 19,2M19,20H5V4H19V20Z"/>
    </svg>
    <div class="man" id="walkingMan"></div>
  </button>
</div>

<script>
function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (!email || !pass) {
    errorMsg.textContent = "⚠️ Please fill in all fields.";
    shakeCard();
    return;
  }

  errorMsg.textContent = "";
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboardBox').style.display = 'block';
}

function shakeCard() {
  const card = document.getElementById('loginBox');
  card.style.transform = "translateX(8px)";
  setTimeout(() => card.style.transform = "translateX(-8px)", 80);
  setTimeout(() => card.style.transform = "translateX(6px)", 160);
  setTimeout(() => card.style.transform = "translateX(0)", 240);
}

function logoutAnimation() {
  const btn = document.getElementById('logoutBtn');
  btn.classList.add('logging-out');

  // After the man walks out animation finishes, reset back to login page
  setTimeout(() => {
    btn.classList.remove('logging-out');
    document.getElementById('email').value = "";
    document.getElementById('password').value = "";
    document.getElementById('dashboardBox').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
  }, 900);
}
</script>

</body>
</html>
